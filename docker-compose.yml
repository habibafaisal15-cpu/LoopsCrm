services:
  db:
    image: postgres:16-alpine
    container_name: loops-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: loops
      POSTGRES_PASSWORD: loops
      POSTGRES_DB: loops
    ports:
      - "5432:5432"
    volumes:
      - loops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loops -d loops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  loops_pg:
